[project]
name = "documentocarrier"
version = "1.0.0"
description = "La Verdad del Documento del Carrier — extracción verificable con procedencia"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.54.0",
]

[project.scripts]
carrier-truth = "carrier_truth.adapters.inbound.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carrier_truth"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
